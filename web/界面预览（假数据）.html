<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习通作业总览</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --text:#1f2328; --muted:#6b7280;
    --todo:#d93025; --peer:#7c3aed; --grading:#d97706; --done:#16a34a; --unknown:#9ca3af;
    --accent:#2b6cb0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:20px;margin:0;font-weight:700}
  .meta{color:var(--muted);font-size:12.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:10px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .n{font-size:24px;font-weight:700;line-height:1.2}
  .card .k{font-size:12px;color:var(--muted);margin-top:2px}
  .card.todo .n{color:var(--todo)} .card.peer .n{color:var(--peer)}
  .card.grading .n{color:var(--grading)} .card.done .n{color:var(--done)}
  .card.expired .n{color:var(--unknown)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:5px 13px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
  .tab:hover{border-color:#cbd5e1}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .c{opacity:.75;margin-left:4px}
  .switch{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
  .course{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .chead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
  .chead:hover{background:#fafbfc}
  .arrow{color:var(--muted);transition:transform .15s;font-size:11px;width:10px}
  .course.open .arrow{transform:rotate(90deg)}
  .cname{font-weight:600}
  .cteacher{color:var(--muted);font-size:12.5px}
  .badges{margin-left:auto;display:flex;gap:6px;align-items:center}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:var(--muted)}
  .badge.todo{background:#fdecea;color:var(--todo);font-weight:600}
  .badge.err{background:#fff7ed;color:#c2410c}
  .items{display:none;border-top:1px solid var(--line)}
  .course.open .items{display:block}
  .item{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 12px;
    border-bottom:1px solid #f3f4f6;text-decoration:none;color:inherit}
  .item:last-child{border-bottom:0}
  .item:hover{background:#f8fafc}
  .dot{width:4px;height:32px;border-radius:2px;flex:0 0 4px;background:var(--unknown)}
  .item.todo .dot{background:var(--todo)} .item.peer .dot{background:var(--peer)}
  .item.grading .dot{background:var(--grading)} .item.done .dot{background:var(--done)}
  .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.done .title{color:var(--muted)}
  .tag{font-size:12px;padding:2px 8px;border-radius:4px;white-space:nowrap;font-weight:600}
  .item.todo .tag{background:#fdecea;color:var(--todo)}
  .item.peer .tag{background:#f3e8ff;color:var(--peer)}
  .item.grading .tag{background:#fef3c7;color:#b45309}
  .item.done .tag{background:#dcfce7;color:var(--done)}
  .item.unknown .tag{background:#f1f5f9;color:var(--muted)}
  .time{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:104px;text-align:right}
  .time.urgent{color:var(--todo);font-weight:700}
  .time.soon{color:var(--grading);font-weight:600}
  .time.over{color:var(--unknown);text-decoration:line-through}
  .lbl{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;
    padding:40px;text-align:center;color:var(--muted)}
  footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.9}
  footer code{background:#eef2f7;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学习通作业总览</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="cards" id="cards"></div>
  <div class="bar" id="tabs"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>
<script>
const DATA = {"scanned_at": "2026-09-23 14:52:10", "summary": {"todo": 3, "peer": 1, "grading": 2, "done": 5, "unknown": 0, "pending": 4, "total": 11, "courses_total": 14, "courses_scanned": 4, "courses_skipped": 10}, "courses": [{"name": "高等数学 A(2)", "teacher": "张伟", "course_id": "1", "error": null, "homeworks": [{"title": "第八章 多元函数微分学 作业", "status_raw": "todo", "state": "todo", "state_text": "未交", "is_peer": false, "is_expired": false, "remain_text": "剩余5小时20分钟", "remain_hours": 5.33, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=101", "work_id": "101", "answer_id": null}, {"title": "第九章 重积分 作业", "status_raw": "todo", "state": "todo", "state_text": "未交", "is_peer": false, "is_expired": false, "remain_text": "剩余2天3小时", "remain_hours": 51.0, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=102", "work_id": "102", "answer_id": null}, {"title": "期中测试（补交）", "status_raw": "todo", "state": "todo", "state_text": "未交", "is_peer": false, "is_expired": true, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=103", "work_id": "103", "answer_id": null}, {"title": "第七章 定积分应用", "status_raw": "done", "state": "done", "state_text": "已完成", "is_peer": false, "is_expired": false, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=104", "work_id": "104", "answer_id": null}]}, {"name": "大学英语（三）", "teacher": "李娜", "course_id": "2", "error": null, "homeworks": [{"title": "Unit 5 写作任务", "status_raw": "todo", "state": "todo", "state_text": "未交", "is_peer": false, "is_expired": false, "remain_text": "剩余20小时", "remain_hours": 20.0, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=201", "work_id": "201", "answer_id": null}, {"title": "Unit 4 课后练习", "status_raw": "done", "state": "done", "state_text": "已完成", "is_peer": false, "is_expired": false, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=202", "work_id": "202", "answer_id": null}, {"title": "小组互评：Presentation", "status_raw": "peer", "state": "peer", "state_text": "待互评", "is_peer": true, "is_expired": false, "remain_text": "剩余30小时", "remain_hours": 30.0, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=203", "work_id": "203", "answer_id": null}]}, {"name": "数据结构与算法", "teacher": "王强", "course_id": "3", "error": null, "homeworks": [{"title": "实验三 二叉树的遍历", "status_raw": "grading", "state": "grading", "state_text": "待批阅", "is_peer": false, "is_expired": false, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=301", "work_id": "301", "answer_id": null}, {"title": "实验二 链表实现", "status_raw": "grading", "state": "grading", "state_text": "待批阅", "is_peer": false, "is_expired": false, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=302", "work_id": "302", "answer_id": null}, {"title": "实验一 顺序表", "status_raw": "done", "state": "done", "state_text": "已完成", "is_peer": false, "is_expired": false, "remain_text": "", "remain_hours": null, "url": "https://mooc1.chaoxing.com/mooc-ans/mooc2/work/task?workId=303", "work_id": "303", "answer_id": null}]}, {"name": "马克思主义基本原理", "teacher": "陈静", "course_id": "4", "error": "没拿到 enc 令牌", "homeworks": []}]};

const STATE = {todo:'未交', peer:'待互评', grading:'待批阅', done:'已完成', unknown:'未知'};
const ORDER = {todo:0, peer:1, grading:2, unknown:3, done:4};

/* 把作业铺平成带课程信息的一维数组 */
const ALL = [];
(DATA.courses || []).forEach(function (c) {
  (c.homeworks || []).forEach(function (h) {
    ALL.push(Object.assign({}, h, {
      course: c.name, teacher: c.teacher, courseError: c.error || null
    }));
  });
});

/* 「还需要动手」＝ 未交 / 待互评，且还没过期 */
const pending = h => (h.state === 'todo' || h.state === 'peer') && !h.is_expired;

function expireLabel(h) {
  /* 已完成的作业不显示时间信息 —— 那是噪音 */
  if (h.state === 'done') return {text:'', cls:''};
  if (h.is_expired) return {text:'已过期', cls:'over'};
  if (h.remain_hours === null || h.remain_hours === undefined) {
    /* 只有还没交的才值得提示「没有截止时间」 */
    return {text: pending(h) ? '无截止时间' : '', cls:''};
  }
  const hr = h.remain_hours;
  let text;
  if (hr >= 24) { const d = Math.floor(hr / 24); text = '剩余 ' + d + ' 天 ' + Math.round(hr - d * 24) + ' 小时'; }
  else if (hr >= 1) { text = '剩余 ' + Math.round(hr) + ' 小时'; }
  else { text = '剩余 ' + Math.max(1, Math.round(hr * 60)) + ' 分钟'; }
  let cls = '';
  if (hr <= 24) cls = 'urgent'; else if (hr <= 72) cls = 'soon';
  return {text: text, cls: cls};
}

let filter = 'all';
let onlyPending = false;

/* ── 摘要卡片 ── */
function renderCards() {
  const n = {all: ALL.length};
  ['todo','peer','grading','done'].forEach(function (s) {
    n[s] = ALL.filter(h => h.state === s).length;
  });
  n.expired = ALL.filter(h => h.is_expired && h.state !== 'done').length;
  n.pending = ALL.filter(pending).length;

  const cards = [
    {cls:'todo',    num:n.pending,  key:'需要动手（未交 + 待互评）'},
    {cls:'todo',    num:n.todo,     key:'未交'},
    {cls:'peer',    num:n.peer,     key:'待互评'},
    {cls:'grading', num:n.grading,  key:'待批阅'},
    {cls:'done',    num:n.done,     key:'已完成'},
    {cls:'expired', num:n.expired,  key:'已过期未完成'},
    {cls:'',        num:n.all,      key:'作业总数'}
  ];
  document.getElementById('cards').innerHTML = cards.map(function (c) {
    return '<div class="card ' + c.cls + '"><div class="n">' + c.num + '</div><div class="k">' + c.key + '</div></div>';
  }).join('');
  return n;
}

/* ── 筛选标签 ── */
function renderTabs(n) {
  const defs = [
    ['all','全部',n.all], ['pending','需动手',n.pending], ['todo','未交',n.todo],
    ['peer','待互评',n.peer], ['grading','待批阅',n.grading], ['done','已完成',n.done],
    ['expired','已过期',n.expired]
  ];
  let html = defs.map(function (d) {
    return '<div class="tab' + (filter === d[0] ? ' on' : '') + '" data-f="' + d[0] + '">'
      + d[1] + '<span class="c">' + d[2] + '</span></div>';
  }).join('');
  html += '<label class="switch"><input type="checkbox" id="onlyPending"' + (onlyPending ? ' checked' : '')
    + '> 只看还需要动手的</label>';
  document.getElementById('tabs').innerHTML = html;

  document.querySelectorAll('.tab').forEach(function (el) {
    el.onclick = function () { filter = el.dataset.f; onlyPending = false; render(); };
  });
  const cb = document.getElementById('onlyPending');
  if (cb) cb.onchange = function () { onlyPending = cb.checked; filter = 'all'; render(); };
}

function match(h) {
  if (onlyPending) return pending(h);
  if (filter === 'all') return true;
  if (filter === 'pending') return pending(h);
  if (filter === 'expired') return h.is_expired && h.state !== 'done';
  return h.state === filter;
}

/* ── 列表 ── */
function renderList() {
  const groups = [];
  (DATA.courses || []).forEach(function (c) {
    const hs = (c.homeworks || []).filter(match).slice().sort(function (a, b) {
      const d = (ORDER[a.state] ?? 9) - (ORDER[b.state] ?? 9);
      if (d !== 0) return d;
      const ra = a.remain_hours === null || a.remain_hours === undefined ? 1e9 : a.remain_hours;
      const rb = b.remain_hours === null || b.remain_hours === undefined ? 1e9 : b.remain_hours;
      return ra - rb;
    });
    if (hs.length || c.error) groups.push({course: c, items: hs});
  });

  const total = groups.reduce((s, g) => s + g.items.length, 0);
  const box = document.getElementById('list');
  if (!total && !groups.length) {
    box.innerHTML = '<div class="empty">这个筛选下没有作业。换一个标签看看，或者点上面的「全部」。</div>';
    return;
  }

  box.innerHTML = groups.map(function (g, gi) {
    const c = g.course;
    const pend = g.items.filter(pending).length;
    const badges = [];
    if (pend) badges.push('<span class="badge todo">待办 ' + pend + '</span>');
    badges.push('<span class="badge">' + g.items.length + ' 条</span>');
    if (c.error) badges.push('<span class="badge err">抓取异常</span>');

    const rows = g.items.map(function (h) {
      const t = expireLabel(h);
      const peerTag = h.is_peer ? '<span class="lbl">互评</span>' : '';
      const href = h.url || '#';
      return '<a class="item ' + h.state + '" href="' + href + '" target="_blank" rel="noopener">'
        + '<span class="dot"></span>'
        + '<span class="title" title="' + esc(h.title) + '">' + esc(h.title) + '</span>'
        + peerTag
        + '<span class="tag">' + (h.is_expired && h.state !== 'done' ? '未交·已过期' : (STATE[h.state] || h.state)) + '</span>'
        + '<span class="time ' + t.cls + '">' + t.text + '</span>'
        + '</a>';
    }).join('');

    const errRow = c.error ? '<div class="item"><span class="time" style="min-width:auto;text-align:left">' + esc(c.error) + '</span></div>' : '';

    return '<div class="course' + (gi < 1 || pend ? ' open' : '') + '" data-i="' + gi + '">'
      + '<div class="chead"><span class="arrow">▶</span>'
      + '<span class="cname">' + esc(c.name) + '</span>'
      + (c.teacher ? '<span class="cteacher">' + esc(c.teacher) + '</span>' : '')
      + '<span class="badges">' + badges.join('') + '</span></div>'
      + '<div class="items">' + rows + errRow + '</div></div>';
  }).join('');

  box.querySelectorAll('.chead').forEach(function (el) {
    el.onclick = function () { el.parentNode.classList.toggle('open'); };
  });
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  const n = renderCards();
  renderTabs(n);
  renderList();
}

document.getElementById('meta').textContent = '扫描于 ' + (DATA.scanned_at || '未知');
const s = DATA.summary || {};
document.getElementById('foot').innerHTML =
  '共 ' + (s.courses_total || 0) + ' 门课程，本次扫描 ' + (s.courses_scanned || 0) + ' 门'
  + (s.courses_skipped ? '（跳过 ' + s.courses_skipped + ' 门已结课）' : '')
  + '。<br>点作业名会跳转到学习通对应页面（如果提示登录，说明当前浏览器还没登录过学习通）。<br>'
  + '数据更新请重新运行 <code>扫描作业.bat</code>。';

render();
</script>
</body>
</html>
